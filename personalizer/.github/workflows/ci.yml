name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: personalizer

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Confirm the app imports correctly
        run: python -c "from app.main import app; print('App imported successfully')"

      - name: Build Docker image
        run: docker build -t personalizer:ci-check .
